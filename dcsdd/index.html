<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCSDD</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101216;
      --panel: rgba(18, 22, 28, 0.86);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f2f5f8;
      --muted: #aab4c0;
      --accent: #42d8b4;
      --accent-2: #f0b84f;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(120deg, rgba(66, 216, 180, 0.08), transparent 40%),
        linear-gradient(300deg, rgba(240, 184, 79, 0.08), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .hud {
      position: fixed;
      inset: 18px auto auto 18px;
      width: min(330px, calc(100vw - 36px));
      padding: 12px 12px 28px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(16px);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }

    .status {
      min-width: 172px;
      color: var(--accent);
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      gap: 9px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    output {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    select {
      width: 100%;
      height: 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      padding: 0 8px;
    }

    select:focus-visible {
      outline: 1px solid rgba(66, 216, 180, 0.62);
      outline-offset: 2px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 2px;
    }

    button {
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(66, 216, 180, 0.48);
      background: rgba(66, 216, 180, 0.12);
    }

    .toggle-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-top: 2px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 26px;
      color: var(--muted);
      font-size: 11px;
    }

    .toggle-name {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .swatch {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 3px;
    }

    .swatch-ms {
      color: rgb(84, 255, 179);
      background: currentColor;
    }

    .swatch-dc {
      color: rgb(255, 199, 66);
      background: currentColor;
    }

    .swatch-dcsdd {
      color: rgb(173, 155, 255);
      background: currentColor;
    }

    .swatch-debug {
      color: rgb(255, 122, 170);
      background: currentColor;
    }

    .swatch-vertex {
      color: rgb(73, 221, 255);
      background: currentColor;
    }

    .swatch-circle {
      color: rgb(255, 169, 74);
      background: currentColor;
    }

    .toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .note {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
      color: rgba(170, 180, 192, 0.78);
      font-size: 11px;
      text-decoration: none;
    }

    .repo-link:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .external-mark {
      width: 11px;
      height: 11px;
      flex: 0 0 auto;
      opacity: 0.82;
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 640px) {
      .hud {
        inset: auto 12px 12px 12px;
        width: auto;
        padding: 10px 12px;
      }

      .title-row,
      .controls > label,
      .button-row,
      .note {
        display: none;
      }

      .controls {
        gap: 0;
      }

      .toggle-row {
        gap: 4px;
        margin-top: 0;
      }

      .toggle {
        min-height: 24px;
        gap: 10px;
      }

      .toggle input {
        width: 15px;
        height: 15px;
      }

      .repo-link {
        margin-top: 6px;
        font-size: 11px;
      }
    }
  </style>
  <link rel="stylesheet" href="../shared/demo-ui.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <section class="hud" id="hud" aria-label="Marching squares controls">
    <button class="compact-toggle-button" id="compactUi" type="button" aria-label="Collapse controls" title="Collapse controls">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="title-row">
      <h1>DCSDD</h1>
      <div class="status" id="status">starting</div>
    </div>

    <div class="controls">
      <label>
        <span class="label-row">
          <span>Cell size</span>
          <output id="cellOut">16 px</output>
        </span>
        <input id="cell" type="range" min="5" max="36" step="1" value="16" />
      </label>

      <label>
        <span class="label-row">
          <span>Outer iterations</span>
          <output id="iterationOut">0</output>
        </span>
        <input id="iterations" type="range" min="0" max="20" step="1" value="0" />
      </label>

      <label>
        <span class="label-row">
          <span>Problem setting</span>
        </span>
        <select id="normalMode">
          <option value="grid">Grid samples only</option>
          <option value="sdf">Arbitrary SDF samples</option>
        </select>
      </label>

      <div class="button-row">
        <button id="pause" type="button">Pause</button>
        <button id="shuffle" type="button">Shuffle field</button>
      </div>

      <div class="toggle-row" aria-label="Display toggles">
        <label class="toggle" for="showMarching">
          <span class="toggle-name"><span class="swatch swatch-ms" aria-hidden="true"></span>Marching Squares</span>
          <input id="showMarching" type="checkbox" checked />
        </label>
        <label class="toggle" for="showContouring">
          <span class="toggle-name"><span class="swatch swatch-dc" aria-hidden="true"></span>Dual Contouring</span>
          <input id="showContouring" type="checkbox" checked />
        </label>
        <label class="toggle" for="showDcsdd">
          <span class="toggle-name"><span class="swatch swatch-dcsdd" aria-hidden="true"></span>DCSDD</span>
          <input id="showDcsdd" type="checkbox" checked />
        </label>
        <label class="toggle" for="debugHermite">
          <span class="toggle-name"><span class="swatch swatch-debug" aria-hidden="true"></span>Hermite debug</span>
          <input id="debugHermite" type="checkbox" />
        </label>
        <label class="toggle" for="debugVertices">
          <span class="toggle-name"><span class="swatch swatch-vertex" aria-hidden="true"></span>Initial vertices</span>
          <input id="debugVertices" type="checkbox" />
        </label>
        <label class="toggle" for="debugSamples">
          <span class="toggle-name">SDF samples debug</span>
          <input id="debugSamples" type="checkbox" />
        </label>
        <label class="toggle" for="debugCircles">
          <span class="toggle-name"><span class="swatch swatch-circle" aria-hidden="true"></span>SDF circles</span>
          <input id="debugCircles" type="checkbox" />
        </label>
      </div>
    </div>

    <p class="note" id="note">1: Marching Squares, 2: Dual Contouring, 3: DCSDD. DCSDD optimization is currently disabled to inspect initialization.</p>
    <a class="repo-link" href="https://github.com/yknishidate/demos" target="_blank" rel="noreferrer">
      <span>github.com/yknishidate/demos</span>
      <svg class="external-mark" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M6 4H3.5A1.5 1.5 0 0 0 2 5.5v7A1.5 1.5 0 0 0 3.5 14h7a1.5 1.5 0 0 0 1.5-1.5V10h-1v2.5a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5v-7a.5.5 0 0 1 .5-.5H6V4Zm2-2v1h4.3L6.65 8.65l.7.7L13 3.7V8h1V2H8Z" fill="currentColor"/>
      </svg>
    </a>
  </section>

  <script type="module">
    import { setupCompactUi } from "../shared/demo-ui.js";

    const canvas = document.querySelector("#canvas");
    const hudEl = document.querySelector("#hud");
    const statusEl = document.querySelector("#status");
    const noteEl = document.querySelector("#note");
    const cellEl = document.querySelector("#cell");
    const iterationsEl = document.querySelector("#iterations");
    const normalModeEl = document.querySelector("#normalMode");
    const cellOut = document.querySelector("#cellOut");
    const iterationOut = document.querySelector("#iterationOut");
    const pauseButton = document.querySelector("#pause");
    const shuffleButton = document.querySelector("#shuffle");
    const showMarchingEl = document.querySelector("#showMarching");
    const showContouringEl = document.querySelector("#showContouring");
    const showDcsddEl = document.querySelector("#showDcsdd");
    const debugHermiteEl = document.querySelector("#debugHermite");
    const debugVerticesEl = document.querySelector("#debugVertices");
    const debugSamplesEl = document.querySelector("#debugSamples");
    const debugCirclesEl = document.querySelector("#debugCircles");
    const compactUiEl = document.querySelector("#compactUi");

    const edgePairs = [
      [],
      [[3, 2]],
      [[2, 1]],
      [[3, 1]],
      [[0, 1]],
      [[0, 1], [3, 2]],
      [[0, 2]],
      [[0, 3]],
      [[0, 3]],
      [[0, 2]],
      [[0, 3], [2, 1]],
      [[0, 1]],
      [[3, 1]],
      [[2, 1]],
      [[3, 2]],
      [],
    ];

    let device;
    let context;
    let pipeline;
    let backgroundPipeline;
    let backgroundUniformBuffer;
    let blobBuffer;
    let contourUniformBuffer;
    let dualUniformBuffer;
    let dcsddUniformBuffer;
    let hermiteDebugUniformBuffer;
    let normalDebugUniformBuffer;
    let vertexDebugUniformBuffer;
    let sampleDebugUniformBuffer;
    let circleDebugUniformBuffer;
    let gridUniformBuffer;
    let segmentBuffer;
    let backgroundBindGroup;
    let contourBindGroup;
    let dualBindGroup;
    let dcsddBindGroup;
    let hermiteDebugBindGroup;
    let normalDebugBindGroup;
    let vertexDebugBindGroup;
    let sampleDebugBindGroup;
    let circleDebugBindGroup;
    let gridBindGroup;
    let segmentCapacity = 0;
    let presentationFormat;
    let width = 1;
    let height = 1;
    let dpr = 1;
    let paused = false;
    let phase = 0;
    let lastTime = performance.now();
    let pointer = { x: 0.5, y: 0.5, active: false };
    let blobs = [];
    const visible = {
      marching: true,
      contouring: true,
      dcsdd: true,
      hermiteDebug: false,
      vertexDebug: false,
      sampleDebug: false,
      circleDebug: false,
    };
    setupCompactUi({ hud: hudEl, button: compactUiEl });

    const shaderCode = `
struct Uniforms {
  resolution: vec2f,
  thickness: f32,
  _pad: f32,
  color: vec4f,
};

@group(0) @binding(0) var<uniform> uniforms: Uniforms;
@group(0) @binding(1) var<storage, read> segments: array<vec4f>;

struct VertexOut {
  @builtin(position) position: vec4f,
  @location(0) local: vec2f,
};

@vertex
fn vs(@builtin(vertex_index) vertexIndex: u32, @builtin(instance_index) instanceIndex: u32) -> VertexOut {
  let seg = segments[instanceIndex];
  let a = seg.xy;
  let b = seg.zw;
  let dir = normalize(b - a);
  let normal = vec2f(-dir.y, dir.x);
  let corner = array<vec2f, 6>(
    vec2f(0.0, -1.0),
    vec2f(1.0, -1.0),
    vec2f(1.0, 1.0),
    vec2f(0.0, -1.0),
    vec2f(1.0, 1.0),
    vec2f(0.0, 1.0)
  )[vertexIndex];
  let p = mix(a, b, corner.x) + normal * corner.y * uniforms.thickness * 0.5;
  let clip = (p / uniforms.resolution) * vec2f(2.0, -2.0) + vec2f(-1.0, 1.0);

  var out: VertexOut;
  out.position = vec4f(clip, 0.0, 1.0);
  out.local = corner;
  return out;
}

@fragment
fn fs(in: VertexOut) -> @location(0) vec4f {
  let core = 1.0 - smoothstep(0.72, 1.0, abs(in.local.y));
  let glow = 1.0 - smoothstep(0.95, 1.65, abs(in.local.y));
  let tint = mix(uniforms.color.rgb * 0.82, uniforms.color.rgb, core);
  return vec4f(tint, uniforms.color.a * max(core, glow * 0.45));
}`;

    const backgroundShaderCode = `
struct Blob {
  a: vec4f,
  b: vec4f,
  c: vec4f,
};

struct BackgroundUniforms {
  resolution: vec2f,
  iso: f32,
  phase: f32,
  pointer: vec2f,
  pointerActive: f32,
  _pad: f32,
};

@group(0) @binding(0) var<uniform> uniforms: BackgroundUniforms;
@group(0) @binding(1) var<storage, read> blobs: array<Blob, 7>;

fn boxDistance(p: vec2f, halfSize: vec2f) -> f32 {
  let q = abs(p) - halfSize;
  return length(max(q, vec2f(0.0))) + min(max(q.x, q.y), 0.0);
}

fn shapeSdf(blob: Blob, pixel: vec2f) -> f32 {
  let minDim = min(uniforms.resolution.x, uniforms.resolution.y);
  let center = vec2f(blob.a.x, blob.a.y) * uniforms.resolution;
  let radius = blob.a.z * minDim;
  let speed = blob.a.w;
  let angle = blob.b.x;
  let rotation = blob.b.z;
  let aspect = blob.b.w;
  let shape = blob.c.x;
  let drift = blob.b.y * minDim;
  let animatedCenter = center + vec2f(
    cos(uniforms.phase * speed + angle),
    sin(uniforms.phase * speed * 0.83 + angle * 1.7)
  ) * drift;
  let turn = rotation + sin(uniforms.phase * speed * 0.7 + angle) * 0.45;
  let c = cos(turn);
  let s = sin(turn);
  let d = pixel - animatedCenter;
  let p = vec2f(d.x * c - d.y * s, d.x * s + d.y * c);

  if (shape < 0.5) {
    return radius - length(vec2f(p.x, p.y / aspect));
  }
  if (shape < 1.5) {
    return -boxDistance(p, vec2f(radius, radius * aspect));
  }
  if (shape < 2.5) {
    let diamond = (abs(p.x) + abs(p.y) / max(0.25, aspect)) * 0.70710678;
    return radius - diamond;
  }
  return -boxDistance(p, vec2f(radius * 1.45, radius * 0.58 * aspect));
}

fn sampleField(pixel: vec2f) -> f32 {
  var sdf = -1.0e6;

  for (var i = 0u; i < 7u; i = i + 1u) {
    let blob = blobs[i];
    sdf = max(sdf, shapeSdf(blob, pixel));
  }

  if (uniforms.pointerActive > 0.5) {
    let minDim = min(uniforms.resolution.x, uniforms.resolution.y);
    let pointerCenter = uniforms.pointer * uniforms.resolution;
    let pointerSdf = -boxDistance(pixel - pointerCenter, vec2f(0.16 * minDim));
    sdf = max(sdf, pointerSdf);
  }

  return sdf;
}

@vertex
fn bgVs(@builtin(vertex_index) vertexIndex: u32) -> @builtin(position) vec4f {
  let p = array<vec2f, 3>(
    vec2f(-1.0, -1.0),
    vec2f(3.0, -1.0),
    vec2f(-1.0, 3.0)
  )[vertexIndex];
  return vec4f(p, 0.0, 1.0);
}

@fragment
fn bgFs(@builtin(position) position: vec4f) -> @location(0) vec4f {
  let field = sampleField(position.xy);
  let band = 1.0 - smoothstep(0.0, 9.0, abs(field - uniforms.iso));
  if (field > uniforms.iso) {
    return vec4f(0.11, 0.50, 0.38, 0.51 + band * 0.21);
  }
  return vec4f(0.20, 0.22, 0.32, 0.27 + band * 0.15);
}`;

    function updateOutputs() {
      cellOut.value = `${cellEl.value} px`;
      iterationOut.value = iterationsEl.value;
    }

    function syncToggles() {
      showMarchingEl.checked = visible.marching;
      showContouringEl.checked = visible.contouring;
      showDcsddEl.checked = visible.dcsdd;
      debugHermiteEl.checked = visible.hermiteDebug;
      debugVerticesEl.checked = visible.vertexDebug;
      debugSamplesEl.checked = visible.sampleDebug;
      debugCirclesEl.checked = visible.circleDebug;
    }

    function shapeId(shape) {
      if (shape === "square") return 1;
      if (shape === "diamond") return 2;
      if (shape === "block") return 3;
      return 0;
    }

    function buildBlobData() {
      const data = new Float32Array(7 * 12);
      for (let i = 0; i < blobs.length; i++) {
        const blob = blobs[i];
        const offset = i * 12;
        data[offset] = blob.x;
        data[offset + 1] = blob.y;
        data[offset + 2] = blob.radius;
        data[offset + 3] = blob.speed;
        data[offset + 4] = blob.angle;
        data[offset + 5] = blob.drift;
        data[offset + 6] = blob.rotation;
        data[offset + 7] = blob.aspect;
        data[offset + 8] = shapeId(blob.shape);
        data[offset + 9] = blob.weight;
      }
      return data;
    }

    function shuffleBlobs() {
      const shapes = ["square", "diamond", "block"];
      blobs = Array.from({ length: 7 }, (_, i) => ({
        x: Math.random(),
        y: Math.random(),
        radius: 0.1 + Math.random() * 0.06,
        speed: 0.35 + Math.random() * 0.85,
        angle: Math.random() * Math.PI * 2,
        drift: 0.08 + Math.random() * 0.16,
        rotation: Math.random() * Math.PI,
        aspect: 0.65 + Math.random() * 0.9,
        shape: shapes[i % shapes.length],
        weight: i % 3 === 0 ? 1.35 : 1.0,
      }));
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      width = Math.max(1, Math.floor(rect.width * dpr));
      height = Math.max(1, Math.floor(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function boxDistance(px, py, hx, hy) {
      const qx = Math.abs(px) - hx;
      const qy = Math.abs(py) - hy;
      return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0);
    }

    function shapeSdf(blob, x, y, t) {
      const minDim = Math.min(width, height);
      const cx = blob.x * width + Math.cos(t * blob.speed + blob.angle) * blob.drift * minDim;
      const cy = blob.y * height + Math.sin(t * blob.speed * 0.83 + blob.angle * 1.7) * blob.drift * minDim;
      const radius = blob.radius * minDim;
      const turn = blob.rotation + Math.sin(t * blob.speed * 0.7 + blob.angle) * 0.45;
      const c = Math.cos(turn);
      const s = Math.sin(turn);
      const dx = x - cx;
      const dy = y - cy;
      const px = dx * c - dy * s;
      const py = dx * s + dy * c;

      if (blob.shape === "square") return -boxDistance(px, py, radius, radius * blob.aspect);
      if (blob.shape === "diamond") return radius - (Math.abs(px) + Math.abs(py) / Math.max(0.25, blob.aspect)) * Math.SQRT1_2;
      if (blob.shape === "block") return -boxDistance(px, py, radius * 1.45, radius * 0.58 * blob.aspect);
      return radius - Math.hypot(px, py / blob.aspect);
    }

    function sampleField(x, y, t) {
      let sdf = -1e6;

      for (const blob of blobs) {
        sdf = Math.max(sdf, shapeSdf(blob, x, y, t));
      }

      if (pointer.active) {
        const minDim = Math.min(width, height);
        const dx = x - pointer.x * width;
        const dy = y - pointer.y * height;
        sdf = Math.max(sdf, -boxDistance(dx, dy, 0.16 * minDim, 0.16 * minDim));
      }

      return sdf;
    }

    function interpolate(p0, p1, v0, v1, iso) {
      const span = v1 - v0;
      const t = Math.abs(span) < 0.00001 ? 0.5 : Math.min(1, Math.max(0, (iso - v0) / span));
      return [
        p0[0] + (p1[0] - p0[0]) * t,
        p0[1] + (p1[1] - p0[1]) * t,
      ];
    }

    function edgePoint(edge, p, v, iso) {
      if (edge === 0) return interpolate(p[0], p[1], v[0], v[1], iso);
      if (edge === 1) return interpolate(p[1], p[2], v[1], v[2], iso);
      if (edge === 2) return interpolate(p[3], p[2], v[3], v[2], iso);
      return interpolate(p[0], p[3], v[0], v[3], iso);
    }

    function estimateSdfNormal(x, y, t) {
      const h = Math.max(1.5, Number(cellEl.value) * dpr * 0.12);
      const x0 = Math.max(0, x - h);
      const x1 = Math.min(width, x + h);
      const y0 = Math.max(0, y - h);
      const y1 = Math.min(height, y + h);
      const gx = sampleField(x1, y, t) - sampleField(x0, y, t);
      const gy = sampleField(x, y1, t) - sampleField(x, y0, t);
      const len = Math.hypot(gx, gy);
      return len > 0.000001 ? [gx / len, gy / len] : [1, 0];
    }

    function estimateBilinearNormal(x, y, bounds, values) {
      const sx = Math.max(0.0001, bounds.x1 - bounds.x0);
      const sy = Math.max(0.0001, bounds.y1 - bounds.y0);
      const u = Math.min(1, Math.max(0, (x - bounds.x0) / sx));
      const v = Math.min(1, Math.max(0, (y - bounds.y0) / sy));
      const gx = ((1 - v) * (values[1] - values[0]) + v * (values[2] - values[3])) / sx;
      const gy = ((1 - u) * (values[3] - values[0]) + u * (values[2] - values[1])) / sy;
      const len = Math.hypot(gx, gy);
      return len > 0.000001 ? [gx / len, gy / len] : [1, 0];
    }

    function solveQef(samples, bounds) {
      let ata00 = 0;
      let ata01 = 0;
      let ata11 = 0;
      let atb0 = 0;
      let atb1 = 0;
      let cx = 0;
      let cy = 0;

      for (const sample of samples) {
        const [px, py, nx, ny] = sample;
        const b = nx * px + ny * py;
        ata00 += nx * nx;
        ata01 += nx * ny;
        ata11 += ny * ny;
        atb0 += nx * b;
        atb1 += ny * b;
        cx += px;
        cy += py;
      }

      cx /= samples.length;
      cy /= samples.length;
      const det = ata00 * ata11 - ata01 * ata01;
      let x = cx;
      let y = cy;

      if (Math.abs(det) > 0.000001) {
        x = (atb0 * ata11 - atb1 * ata01) / det;
        y = (ata00 * atb1 - ata01 * atb0) / det;
      }

      if (x < bounds.x0 || x > bounds.x1 || y < bounds.y0 || y > bounds.y1) {
        x = cx;
        y = cy;
      }

      return [
        Math.min(bounds.x1, Math.max(bounds.x0, x)),
        Math.min(bounds.y1, Math.max(bounds.y0, y)),
      ];
    }

    function buildFieldGrid(t) {
      const cell = Number(cellEl.value) * dpr;
      const iso = 0;
      const cols = Math.ceil(width / cell);
      const rows = Math.ceil(height / cell);
      const values = new Float32Array((cols + 1) * (rows + 1));

      for (let y = 0; y <= rows; y++) {
        for (let x = 0; x <= cols; x++) {
          values[y * (cols + 1) + x] = sampleField(Math.min(width, x * cell), Math.min(height, y * cell), t);
        }
      }

      return { cell, iso, cols, rows, values };
    }

    function buildMarchingSegments(field) {
      const { cell, iso, cols, rows, values } = field;
      const segments = [];
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const x0 = x * cell;
          const y0 = y * cell;
          const x1 = Math.min(width, x0 + cell);
          const y1 = Math.min(height, y0 + cell);
          const p = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
          const i = y * (cols + 1) + x;
          const v = [
            values[i],
            values[i + 1],
            values[i + cols + 2],
            values[i + cols + 1],
          ];
          const mask = (v[0] > iso ? 8 : 0) | (v[1] > iso ? 4 : 0) | (v[2] > iso ? 2 : 0) | (v[3] > iso ? 1 : 0);

          for (const pair of edgePairs[mask]) {
            const a = edgePoint(pair[0], p, v, iso);
            const b = edgePoint(pair[1], p, v, iso);
            const dx = a[0] - b[0];
            const dy = a[1] - b[1];
            if (dx * dx + dy * dy > 0.01) {
              segments.push(a[0], a[1], b[0], b[1]);
            }
          }
        }
      }

      return new Float32Array(segments);
    }

    function buildDualSegments(field, t) {
      const { cell, iso, cols, rows, values } = field;
      const vertices = new Float32Array(cols * rows * 2);
      const valid = new Uint8Array(cols * rows);
      const segments = [];

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const x0 = x * cell;
          const y0 = y * cell;
          const x1 = Math.min(width, x0 + cell);
          const y1 = Math.min(height, y0 + cell);
          const p = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
          const i = y * (cols + 1) + x;
          const v = [
            values[i],
            values[i + 1],
            values[i + cols + 2],
            values[i + cols + 1],
          ];
          const mask = (v[0] > iso ? 8 : 0) | (v[1] > iso ? 4 : 0) | (v[2] > iso ? 2 : 0) | (v[3] > iso ? 1 : 0);
          if (mask === 0 || mask === 15) continue;

          const samples = [];
          for (let edge = 0; edge < 4; edge++) {
            const a = [0, 1, 3, 0][edge];
            const b = [1, 2, 2, 3][edge];
            if ((v[a] > iso) === (v[b] > iso)) continue;
            const crossing = edgePoint(edge, p, v, iso);
            const normal = normalModeEl.value === "grid"
              ? estimateBilinearNormal(crossing[0], crossing[1], { x0, y0, x1, y1 }, v)
              : estimateSdfNormal(crossing[0], crossing[1], t);
            samples.push([crossing[0], crossing[1], normal[0], normal[1]]);
          }
          if (samples.length === 0) continue;

          const qefPoint = solveQef(samples, { x0, y0, x1, y1 });

          const index = y * cols + x;
          vertices[index * 2] = qefPoint[0];
          vertices[index * 2 + 1] = qefPoint[1];
          valid[index] = 1;
        }
      }

      function pushConnection(a, b) {
        if (!valid[a] || !valid[b]) return;
        const ax = vertices[a * 2];
        const ay = vertices[a * 2 + 1];
        const bx = vertices[b * 2];
        const by = vertices[b * 2 + 1];
        const dx = ax - bx;
        const dy = ay - by;
        if (dx * dx + dy * dy > 0.01) {
          segments.push(ax, ay, bx, by);
        }
      }

      for (let y = 0; y < rows; y++) {
        for (let x = 1; x < cols; x++) {
          const top = y * (cols + 1) + x;
          const bottom = (y + 1) * (cols + 1) + x;
          if ((values[top] > iso) !== (values[bottom] > iso)) {
            pushConnection(y * cols + x - 1, y * cols + x);
          }
        }
      }

      for (let y = 1; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const left = y * (cols + 1) + x;
          const right = left + 1;
          if ((values[left] > iso) !== (values[right] > iso)) {
            pushConnection((y - 1) * cols + x, y * cols + x);
          }
        }
      }

      return new Float32Array(segments);
    }

    function cellIndex(x, y, cols) {
      return y * cols + x;
    }

    function crossingEdgeKey(x, y, edge) {
      if (edge === 0) return `h:${y}:${x}`;
      if (edge === 1) return `v:${y}:${x + 1}`;
      if (edge === 2) return `h:${y + 1}:${x}`;
      return `v:${y}:${x}`;
    }

    function gridVertexPoint(gx, gy, field) {
      return {
        x: Math.min(width, gx * field.cell),
        y: Math.min(height, gy * field.cell),
      };
    }

    function fieldGradientAtGridVertex(gx, gy, field) {
      const { cell, cols, rows, values } = field;
      const x0 = Math.max(0, gx - 1);
      const x1 = Math.min(cols, gx + 1);
      const y0 = Math.max(0, gy - 1);
      const y1 = Math.min(rows, gy + 1);
      const vx0 = values[gy * (cols + 1) + x0];
      const vx1 = values[gy * (cols + 1) + x1];
      const vy0 = values[y0 * (cols + 1) + gx];
      const vy1 = values[y1 * (cols + 1) + gx];
      const dx = Math.max(0.0001, (x1 - x0) * cell);
      const dy = Math.max(0.0001, (y1 - y0) * cell);
      return [(vx1 - vx0) / dx, (vy1 - vy0) / dy];
    }

    function edgeEndpointsForCell(x, y, edge, field) {
      if (edge === 0) return [gridVertexPoint(x, y, field), gridVertexPoint(x + 1, y, field)];
      if (edge === 1) return [gridVertexPoint(x + 1, y, field), gridVertexPoint(x + 1, y + 1, field)];
      if (edge === 2) return [gridVertexPoint(x, y + 1, field), gridVertexPoint(x + 1, y + 1, field)];
      return [gridVertexPoint(x, y, field), gridVertexPoint(x, y + 1, field)];
    }

    function solveWeightedConstraints(constraints, fallback, bounds) {
      let ata00 = 0;
      let ata01 = 0;
      let ata11 = 0;
      let atb0 = 0;
      let atb1 = 0;

      for (const constraint of constraints) {
        const w = constraint.w;
        const nx = constraint.nx;
        const ny = constraint.ny;
        const b = constraint.b;
        ata00 += w * nx * nx;
        ata01 += w * nx * ny;
        ata11 += w * ny * ny;
        atb0 += w * nx * b;
        atb1 += w * ny * b;
      }

      const det = ata00 * ata11 - ata01 * ata01;
      let x = fallback.x;
      let y = fallback.y;
      if (Math.abs(det) > 0.000001) {
        x = (atb0 * ata11 - atb1 * ata01) / det;
        y = (ata00 * atb1 - ata01 * atb0) / det;
      }

      return {
        x: Math.min(bounds.x1, Math.max(bounds.x0, x)),
        y: Math.min(bounds.y1, Math.max(bounds.y0, y)),
      };
    }

    function lineIntersection(a, b, c, d) {
      const r = { x: b.x - a.x, y: b.y - a.y };
      const s = { x: d.x - c.x, y: d.y - c.y };
      const denom = r.x * s.y - r.y * s.x;
      if (Math.abs(denom) < 0.000001) return null;
      const dx = c.x - a.x;
      const dy = c.y - a.y;
      const u = (dx * r.y - dy * r.x) / denom;
      if (u < 0 || u > 1) return null;
      return {
        x: c.x + s.x * u,
        y: c.y + s.y * u,
      };
    }

    function closestPointOnSegment(p, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const lengthSq = dx * dx + dy * dy;
      if (lengthSq < 0.000001) return { x: a.x, y: a.y, t: 0 };
      const t = Math.min(1, Math.max(0, ((p.x - a.x) * dx + (p.y - a.y) * dy) / lengthSq));
      return {
        x: a.x + dx * t,
        y: a.y + dy * t,
        t,
      };
    }

    function addCrossSegments(out, x, y, size) {
      out.push(x - size, y, x + size, y);
      out.push(x, y - size, x, y + size);
    }

    function addCircleSegments(out, x, y, radius, steps = 18) {
      if (radius < 0.5) return;
      for (let i = 0; i < steps; i++) {
        const a0 = (i / steps) * Math.PI * 2;
        const a1 = ((i + 1) / steps) * Math.PI * 2;
        out.push(
          x + Math.cos(a0) * radius,
          y + Math.sin(a0) * radius,
          x + Math.cos(a1) * radius,
          y + Math.sin(a1) * radius,
        );
      }
    }

    function buildDcsddSegments(field) {
      const { cell, iso, cols, rows, values } = field;
      const edges = [];
      const edgeMap = new Map();
      const cells = Array.from({ length: cols * rows }, () => null);
      const cornerA = [0, 1, 3, 0];
      const cornerB = [1, 2, 2, 3];

      function getEdge(x, y, edge, p, localValues, bounds) {
        const key = crossingEdgeKey(x, y, edge);
        let index = edgeMap.get(key);
        if (index !== undefined) return index;

        const a = cornerA[edge];
        const b = cornerB[edge];
        const pointArray = edgePoint(edge, p, localValues, iso);
        const normalArray = estimateBilinearNormal(pointArray[0], pointArray[1], bounds, localValues);
        const endpoints = edgeEndpointsForCell(x, y, edge, field);
        index = edges.length;
        edgeMap.set(key, index);
        edges.push({
          key,
          p: { x: pointArray[0], y: pointArray[1] },
          n: { x: normalArray[0], y: normalArray[1] },
          endpoints,
          cells: [],
          signs: [localValues[a] > iso, localValues[b] > iso],
        });
        return index;
      }

      // First pass: identify edge crossings and compute Hermite data
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const x0 = x * cell;
          const y0 = y * cell;
          const x1 = Math.min(width, x0 + cell);
          const y1 = Math.min(height, y0 + cell);
          const p = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
          const i = y * (cols + 1) + x;
          const localValues = [
            values[i],
            values[i + 1],
            values[i + cols + 2],
            values[i + cols + 1],
          ];
          const mask = (localValues[0] > iso ? 8 : 0) | (localValues[1] > iso ? 4 : 0) | (localValues[2] > iso ? 2 : 0) | (localValues[3] > iso ? 1 : 0);
          if (mask === 0 || mask === 15) continue;

          const index = cellIndex(x, y, cols);
          const hermites = [];
          const bounds = { x0, y0, x1, y1 };
          for (let edge = 0; edge < 4; edge++) {
            const a = cornerA[edge];
            const b = cornerB[edge];
            if ((localValues[a] > iso) === (localValues[b] > iso)) continue;
            const edgeIndex = getEdge(x, y, edge, p, localValues, bounds);
            hermites.push(edgeIndex);
            edges[edgeIndex].cells.push(index);
          }

          if (hermites.length === 0) continue;
          let vx = 0;
          let vy = 0;
          for (const edgeIndex of hermites) {
            vx += edges[edgeIndex].p.x;
            vy += edges[edgeIndex].p.y;
          }
          vx /= hermites.length;
          vy /= hermites.length;
          cells[index] = {
            x,
            y,
            bounds,
            hermites,
            v: { x: vx, y: vy },
          };
        }
      }

      const narrowBand = cell * 2.5;
      const distanceWeight = 0.12;
      const hermiteWeight = 0.02;
      const regularizationWeight = 0.018;
      const hermiteUpdateWeight = 0.18;
      const vertexDamping = 0.46;
      const maxVertexMove = cell * 0.28;
      const outerIterations = Number(iterationsEl.value);

      function gatherCellSamples(cellInfo) {
        const samples = [];
        const seen = new Set();
        for (let gy = Math.max(0, cellInfo.y - 1); gy <= Math.min(rows, cellInfo.y + 2); gy++) {
          for (let gx = Math.max(0, cellInfo.x - 1); gx <= Math.min(cols, cellInfo.x + 2); gx++) {
            const key = `${gx}:${gy}`;
            if (seen.has(key)) continue;
            seen.add(key);
            const value = values[gy * (cols + 1) + gx];
            const signedDistance = value - iso;
            if (Math.abs(signedDistance) > narrowBand) continue;
            const p = gridVertexPoint(gx, gy, field);
            samples.push({ x: p.x, y: p.y, distance: Math.abs(signedDistance) });
          }
        }
        return samples;
      }

      for (let iteration = 0; iteration < outerIterations; iteration++) {
        for (const cellInfo of cells) {
          if (!cellInfo) continue;
          const constraints = [];

          for (const edgeIndex of cellInfo.hermites) {
            const hermite = edges[edgeIndex];
            constraints.push({
              nx: hermite.n.x,
              ny: hermite.n.y,
              b: hermite.n.x * hermite.p.x + hermite.n.y * hermite.p.y,
              w: hermiteWeight,
            });
          }

          for (const sample of gatherCellSamples(cellInfo)) {
            const samplePoint = { x: sample.x, y: sample.y };
            let best = null;
            for (const edgeIndex of cellInfo.hermites) {
              const hermite = edges[edgeIndex];
              const closest = closestPointOnSegment(samplePoint, cellInfo.v, hermite.p);
              const dx = closest.x - sample.x;
              const dy = closest.y - sample.y;
              const distanceSq = dx * dx + dy * dy;
              if (!best || distanceSq < best.distanceSq) {
                best = { closest, hermite, distanceSq };
              }
            }
            if (!best) continue;

            const dx = best.closest.x - sample.x;
            const dy = best.closest.y - sample.y;
            const length = Math.hypot(dx, dy);
            if (length < 0.0001) continue;
            const nx = dx / length;
            const ny = dy / length;
            const vertexCoeff = 1 - best.closest.t;
            if (vertexCoeff < 0.08) continue;
            const b = (sample.distance + nx * sample.x + ny * sample.y - best.closest.t * (nx * best.hermite.p.x + ny * best.hermite.p.y)) / vertexCoeff;
            constraints.push({
              nx,
              ny,
              b,
              w: distanceWeight * vertexCoeff * vertexCoeff,
            });
          }

          constraints.push({ nx: 1, ny: 0, b: cellInfo.v.x, w: regularizationWeight });
          constraints.push({ nx: 0, ny: 1, b: cellInfo.v.y, w: regularizationWeight });
          const previous = cellInfo.v;
          const solved = solveWeightedConstraints(constraints, previous, cellInfo.bounds);
          let dx = solved.x - previous.x;
          let dy = solved.y - previous.y;
          const length = Math.hypot(dx, dy);
          if (length > maxVertexMove) {
            dx *= maxVertexMove / length;
            dy *= maxVertexMove / length;
          }
          cellInfo.v = {
            x: Math.min(cellInfo.bounds.x1, Math.max(cellInfo.bounds.x0, previous.x + dx * vertexDamping)),
            y: Math.min(cellInfo.bounds.y1, Math.max(cellInfo.bounds.y0, previous.y + dy * vertexDamping)),
          };
        }

        for (const edge of edges) {
          const adjacent = edge.cells.map((index) => cells[index]).filter(Boolean);
          if (adjacent.length < 2) continue;
          const a = adjacent[0].v;
          const b = adjacent[1].v;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const length = Math.hypot(dx, dy);
          if (length < 0.0001) continue;
          let nx = -dy / length;
          let ny = dx / length;
          if (nx * edge.n.x + ny * edge.n.y < 0) {
            nx = -nx;
            ny = -ny;
          }
          const intersection = lineIntersection(a, b, edge.endpoints[0], edge.endpoints[1]) ?? edge.p;
          edge.p = {
            x: edge.p.x * (1 - hermiteUpdateWeight) + intersection.x * hermiteUpdateWeight,
            y: edge.p.y * (1 - hermiteUpdateWeight) + intersection.y * hermiteUpdateWeight,
          };
          const blendedNormal = {
            x: edge.n.x * (1 - hermiteUpdateWeight) + nx * hermiteUpdateWeight,
            y: edge.n.y * (1 - hermiteUpdateWeight) + ny * hermiteUpdateWeight,
          };
          const normalLength = Math.hypot(blendedNormal.x, blendedNormal.y) || 1;
          edge.n = {
            x: blendedNormal.x / normalLength,
            y: blendedNormal.y / normalLength,
          };
        }
      }

      const contourSegments = [];
      for (const edge of edges) {
        const adjacent = edge.cells.map((index) => cells[index]).filter(Boolean);
        if (adjacent.length < 2) continue;
        const a = adjacent[0].v;
        const b = adjacent[1].v;
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        if (dx * dx + dy * dy > 0.01) {
          contourSegments.push(a.x, a.y, b.x, b.y);
        }
      }

      const hermiteSegments = [];
      const normalSegments = [];
      const vertexSegments = [];
      const sampleSegments = [];
      const circleSegments = [];
      const cross = Math.max(1.5, dpr * 1.8);
      const normalScale = cell * 0.34;
      for (const edge of edges) {
        addCrossSegments(hermiteSegments, edge.p.x, edge.p.y, cross);
        normalSegments.push(edge.p.x, edge.p.y, edge.p.x + edge.n.x * normalScale, edge.p.y + edge.n.y * normalScale);
      }
      for (const cellInfo of cells) {
        if (!cellInfo) continue;
        addCrossSegments(vertexSegments, cellInfo.v.x, cellInfo.v.y, Math.max(2.2, dpr * 2.4));
      }

      for (let gy = 0; gy <= rows; gy++) {
        for (let gx = 0; gx <= cols; gx++) {
          const value = values[gy * (cols + 1) + gx];
          if (Math.abs(value - iso) > narrowBand) continue;
          const p = gridVertexPoint(gx, gy, field);
          addCrossSegments(sampleSegments, p.x, p.y, Math.max(1, dpr * 1.1));
        }
      }
      const circleSeen = new Set();
      for (const cellInfo of cells) {
        if (!cellInfo) continue;
        for (let dy = 0; dy <= 1; dy++) {
          for (let dx = 0; dx <= 1; dx++) {
            const gx = cellInfo.x + dx;
            const gy = cellInfo.y + dy;
            const key = `${gx}:${gy}`;
            if (circleSeen.has(key)) continue;
            circleSeen.add(key);
            const value = values[gy * (cols + 1) + gx];
            const p = gridVertexPoint(gx, gy, field);
            addCircleSegments(circleSegments, p.x, p.y, Math.abs(value - iso), 20);
          }
        }
      }

      return {
        contourSegments: new Float32Array(contourSegments),
        hermiteSegments: new Float32Array(hermiteSegments),
        normalSegments: new Float32Array(normalSegments),
        vertexSegments: new Float32Array(vertexSegments),
        sampleSegments: new Float32Array(sampleSegments),
        circleSegments: new Float32Array(circleSegments),
        cellCount: cells.reduce((count, cellInfo) => count + (cellInfo ? 1 : 0), 0),
        edgeCount: edges.length,
      };
    }

    function buildGridSegments() {
      const cell = Number(cellEl.value) * dpr;
      const segments = [];

      for (let x = 0; x <= width + 0.5; x += cell) {
        const gx = Math.min(width, x);
        segments.push(gx, 0, gx, height);
      }

      for (let y = 0; y <= height + 0.5; y += cell) {
        const gy = Math.min(height, y);
        segments.push(0, gy, width, gy);
      }

      return new Float32Array(segments);
    }

    function ensureSegmentBuffer(floatCount) {
      if (segmentBuffer && floatCount <= segmentCapacity) return;
      segmentCapacity = Math.max(floatCount, 1024);
      segmentBuffer?.destroy();
      segmentBuffer = device.createBuffer({
        size: segmentCapacity * Float32Array.BYTES_PER_ELEMENT,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
      });
      gridBindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: gridUniformBuffer } },
          { binding: 1, resource: { buffer: segmentBuffer } },
        ],
      });
      contourBindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: contourUniformBuffer } },
          { binding: 1, resource: { buffer: segmentBuffer } },
        ],
      });
      dualBindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: dualUniformBuffer } },
          { binding: 1, resource: { buffer: segmentBuffer } },
        ],
      });
      dcsddBindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: dcsddUniformBuffer } },
          { binding: 1, resource: { buffer: segmentBuffer } },
        ],
      });
      hermiteDebugBindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: hermiteDebugUniformBuffer } },
          { binding: 1, resource: { buffer: segmentBuffer } },
        ],
      });
      normalDebugBindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: normalDebugUniformBuffer } },
          { binding: 1, resource: { buffer: segmentBuffer } },
        ],
      });
      vertexDebugBindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: vertexDebugUniformBuffer } },
          { binding: 1, resource: { buffer: segmentBuffer } },
        ],
      });
      sampleDebugBindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: sampleDebugUniformBuffer } },
          { binding: 1, resource: { buffer: segmentBuffer } },
        ],
      });
      circleDebugBindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: circleDebugUniformBuffer } },
          { binding: 1, resource: { buffer: segmentBuffer } },
        ],
      });
    }

    function render(now) {
      resize();
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      if (!paused) phase += dt;

      const gridSegments = buildGridSegments();
      const field = buildFieldGrid(phase);
      const segments = visible.marching ? buildMarchingSegments(field) : new Float32Array();
      const dualSegments = visible.contouring ? buildDualSegments(field, phase) : new Float32Array();
      const dcsdd = visible.dcsdd || visible.hermiteDebug || visible.vertexDebug || visible.sampleDebug || visible.circleDebug
        ? buildDcsddSegments(field)
        : {
            contourSegments: new Float32Array(),
            hermiteSegments: new Float32Array(),
            normalSegments: new Float32Array(),
            vertexSegments: new Float32Array(),
            sampleSegments: new Float32Array(),
            circleSegments: new Float32Array(),
            cellCount: 0,
            edgeCount: 0,
          };
      const dcsddOffset = gridSegments.length + segments.length + dualSegments.length;
      const hermiteOffset = dcsddOffset + dcsdd.contourSegments.length;
      const normalOffset = hermiteOffset + dcsdd.hermiteSegments.length;
      const vertexOffset = normalOffset + dcsdd.normalSegments.length;
      const sampleOffset = vertexOffset + dcsdd.vertexSegments.length;
      const circleOffset = sampleOffset + dcsdd.sampleSegments.length;
      const combinedSegments = new Float32Array(circleOffset + dcsdd.circleSegments.length);
      combinedSegments.set(gridSegments);
      combinedSegments.set(segments, gridSegments.length);
      combinedSegments.set(dualSegments, gridSegments.length + segments.length);
      combinedSegments.set(dcsdd.contourSegments, dcsddOffset);
      combinedSegments.set(dcsdd.hermiteSegments, hermiteOffset);
      combinedSegments.set(dcsdd.normalSegments, normalOffset);
      combinedSegments.set(dcsdd.vertexSegments, vertexOffset);
      combinedSegments.set(dcsdd.sampleSegments, sampleOffset);
      combinedSegments.set(dcsdd.circleSegments, circleOffset);
      ensureSegmentBuffer(Math.max(4, combinedSegments.length));
      if (combinedSegments.length > 0) {
        device.queue.writeBuffer(segmentBuffer, 0, combinedSegments);
      }

      const gridUniformData = new Float32Array([width, height, Math.max(1, dpr), 0, 0.55, 0.68, 0.78, 0.16]);
      const contourUniformData = new Float32Array([width, height, 3 * dpr, 0, 0.33, 1.0, 0.70, 0.95]);
      const dualUniformData = new Float32Array([width, height, Math.max(1, 3 * dpr * 0.72), 0, 1.0, 0.78, 0.26, 0.9]);
      const dcsddUniformData = new Float32Array([width, height, Math.max(1, 3 * dpr * 0.62), 0, 0.68, 0.60, 1.0, 0.9]);
      const hermiteDebugUniformData = new Float32Array([width, height, Math.max(1, dpr * 1.15), 0, 1.0, 0.42, 0.67, 0.78]);
      const normalDebugUniformData = new Float32Array([width, height, Math.max(1, dpr), 0, 0.78, 0.86, 1.0, 0.62]);
      const vertexDebugUniformData = new Float32Array([width, height, Math.max(1.2, dpr * 1.25), 0, 0.30, 0.86, 1.0, 0.82]);
      const sampleDebugUniformData = new Float32Array([width, height, Math.max(1, dpr), 0, 1.0, 0.92, 0.45, 0.58]);
      const circleDebugUniformData = new Float32Array([width, height, Math.max(1, dpr * 0.9), 0, 1.0, 0.56, 0.22, 0.38]);
      const backgroundUniformData = new Float32Array([width, height, 0, phase, pointer.x, pointer.y, pointer.active ? 1 : 0, 0]);
      device.queue.writeBuffer(gridUniformBuffer, 0, gridUniformData);
      device.queue.writeBuffer(contourUniformBuffer, 0, contourUniformData);
      device.queue.writeBuffer(dualUniformBuffer, 0, dualUniformData);
      device.queue.writeBuffer(dcsddUniformBuffer, 0, dcsddUniformData);
      device.queue.writeBuffer(hermiteDebugUniformBuffer, 0, hermiteDebugUniformData);
      device.queue.writeBuffer(normalDebugUniformBuffer, 0, normalDebugUniformData);
      device.queue.writeBuffer(vertexDebugUniformBuffer, 0, vertexDebugUniformData);
      device.queue.writeBuffer(sampleDebugUniformBuffer, 0, sampleDebugUniformData);
      device.queue.writeBuffer(circleDebugUniformBuffer, 0, circleDebugUniformData);
      device.queue.writeBuffer(backgroundUniformBuffer, 0, backgroundUniformData);
      device.queue.writeBuffer(blobBuffer, 0, buildBlobData());

      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: { r: 0.04, g: 0.045, b: 0.055, a: 1 },
          loadOp: "clear",
          storeOp: "store",
        }],
      });
      pass.setPipeline(backgroundPipeline);
      pass.setBindGroup(0, backgroundBindGroup);
      pass.draw(3);
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, gridBindGroup);
      pass.draw(6, gridSegments.length / 4);
      if (visible.marching) {
        pass.setBindGroup(0, contourBindGroup);
        pass.draw(6, segments.length / 4, 0, gridSegments.length / 4);
      }
      if (visible.contouring) {
        pass.setBindGroup(0, dualBindGroup);
        pass.draw(6, dualSegments.length / 4, 0, (gridSegments.length + segments.length) / 4);
      }
      if (visible.dcsdd) {
        pass.setBindGroup(0, dcsddBindGroup);
        pass.draw(6, dcsdd.contourSegments.length / 4, 0, dcsddOffset / 4);
      }
      if (visible.hermiteDebug) {
        pass.setBindGroup(0, hermiteDebugBindGroup);
        pass.draw(6, dcsdd.hermiteSegments.length / 4, 0, hermiteOffset / 4);
        pass.setBindGroup(0, normalDebugBindGroup);
        pass.draw(6, dcsdd.normalSegments.length / 4, 0, normalOffset / 4);
      }
      if (visible.vertexDebug) {
        pass.setBindGroup(0, vertexDebugBindGroup);
        pass.draw(6, dcsdd.vertexSegments.length / 4, 0, vertexOffset / 4);
      }
      if (visible.sampleDebug) {
        pass.setBindGroup(0, sampleDebugBindGroup);
        pass.draw(6, dcsdd.sampleSegments.length / 4, 0, sampleOffset / 4);
      }
      if (visible.circleDebug) {
        pass.setBindGroup(0, circleDebugBindGroup);
        pass.draw(6, dcsdd.circleSegments.length / 4, 0, circleOffset / 4);
      }
      pass.end();
      device.queue.submit([encoder.finish()]);

      const msLabel = visible.marching ? `${segments.length / 4 | 0} ms` : "ms off";
      const dcLabel = visible.contouring ? `${dualSegments.length / 4 | 0} dc` : "dc off";
      const dcsddLabel = visible.dcsdd ? `${dcsdd.contourSegments.length / 4 | 0} ds` : "ds off";
      statusEl.textContent = `${msLabel} / ${dcLabel} / ${dcsddLabel}`;
      requestAnimationFrame(render);
    }

    async function init() {
      updateOutputs();
      syncToggles();
      shuffleBlobs();

      if (!navigator.gpu) {
        statusEl.textContent = "no webgpu";
        statusEl.classList.add("error");
        noteEl.textContent = "WebGPU is not available in this browser. Use a recent Chrome, Edge, or Safari Technology Preview build.";
        return;
      }

      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        statusEl.textContent = "no adapter";
        statusEl.classList.add("error");
        noteEl.textContent = "No compatible GPU adapter was found.";
        return;
      }

      device = await adapter.requestDevice();
      context = canvas.getContext("webgpu");
      presentationFormat = navigator.gpu.getPreferredCanvasFormat();
      context.configure({
        device,
        format: presentationFormat,
        alphaMode: "opaque",
      });

      backgroundUniformBuffer = device.createBuffer({
        size: 32,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      blobBuffer = device.createBuffer({
        size: 7 * 12 * Float32Array.BYTES_PER_ELEMENT,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
      });
      gridUniformBuffer = device.createBuffer({
        size: 32,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      contourUniformBuffer = device.createBuffer({
        size: 32,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      dualUniformBuffer = device.createBuffer({
        size: 32,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      dcsddUniformBuffer = device.createBuffer({
        size: 32,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      hermiteDebugUniformBuffer = device.createBuffer({
        size: 32,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      normalDebugUniformBuffer = device.createBuffer({
        size: 32,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      vertexDebugUniformBuffer = device.createBuffer({
        size: 32,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      sampleDebugUniformBuffer = device.createBuffer({
        size: 32,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      circleDebugUniformBuffer = device.createBuffer({
        size: 32,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });

      const shaderModule = device.createShaderModule({ code: shaderCode });
      const backgroundShaderModule = device.createShaderModule({ code: backgroundShaderCode });
      pipeline = device.createRenderPipeline({
        layout: "auto",
        vertex: {
          module: shaderModule,
          entryPoint: "vs",
        },
        fragment: {
          module: shaderModule,
          entryPoint: "fs",
          targets: [{
            format: presentationFormat,
            blend: {
              color: { srcFactor: "src-alpha", dstFactor: "one-minus-src-alpha", operation: "add" },
              alpha: { srcFactor: "one", dstFactor: "one-minus-src-alpha", operation: "add" },
            },
          }],
        },
        primitive: {
          topology: "triangle-list",
        },
      });
      backgroundPipeline = device.createRenderPipeline({
        layout: "auto",
        vertex: {
          module: backgroundShaderModule,
          entryPoint: "bgVs",
        },
        fragment: {
          module: backgroundShaderModule,
          entryPoint: "bgFs",
          targets: [{
            format: presentationFormat,
            blend: {
              color: { srcFactor: "src-alpha", dstFactor: "one-minus-src-alpha", operation: "add" },
              alpha: { srcFactor: "one", dstFactor: "one-minus-src-alpha", operation: "add" },
            },
          }],
        },
        primitive: {
          topology: "triangle-list",
        },
      });
      backgroundBindGroup = device.createBindGroup({
        layout: backgroundPipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: backgroundUniformBuffer } },
          { binding: 1, resource: { buffer: blobBuffer } },
        ],
      });

      ensureSegmentBuffer(1024);
      requestAnimationFrame(render);
    }

    for (const input of [cellEl, iterationsEl]) {
      input.addEventListener("input", updateOutputs);
    }

    showMarchingEl.addEventListener("change", () => {
      visible.marching = showMarchingEl.checked;
    });

    showContouringEl.addEventListener("change", () => {
      visible.contouring = showContouringEl.checked;
    });

    showDcsddEl.addEventListener("change", () => {
      visible.dcsdd = showDcsddEl.checked;
    });

    debugHermiteEl.addEventListener("change", () => {
      visible.hermiteDebug = debugHermiteEl.checked;
    });

    debugVerticesEl.addEventListener("change", () => {
      visible.vertexDebug = debugVerticesEl.checked;
    });

    debugSamplesEl.addEventListener("change", () => {
      visible.sampleDebug = debugSamplesEl.checked;
    });

    debugCirclesEl.addEventListener("change", () => {
      visible.circleDebug = debugCirclesEl.checked;
    });

    pauseButton.addEventListener("click", () => {
      paused = !paused;
      pauseButton.textContent = paused ? "Resume" : "Pause";
    });

    shuffleButton.addEventListener("click", shuffleBlobs);

    window.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLButtonElement || event.target instanceof HTMLSelectElement) return;
      if (event.key === "1") visible.marching = !visible.marching;
      if (event.key === "2") visible.contouring = !visible.contouring;
      if (event.key === "3") visible.dcsdd = !visible.dcsdd;
      syncToggles();
    });

    canvas.addEventListener("pointermove", (event) => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = (event.clientX - rect.left) / rect.width;
      pointer.y = (event.clientY - rect.top) / rect.height;
      pointer.active = true;
    });

    canvas.addEventListener("pointerleave", () => {
      pointer.active = false;
    });

    window.addEventListener("resize", resize);
    init();
  </script>
</body>
</html>
