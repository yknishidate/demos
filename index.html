<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demos</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101216;
      --text: #eef3f6;
      --muted: #9ba7b2;
      --line: rgba(255, 255, 255, 0.12);
      --accent: #42d8b4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 56px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    nav {
      border-top: 1px solid var(--line);
    }

    a {
      display: grid;
      gap: 6px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }

    a:hover strong {
      color: var(--accent);
    }

    strong {
      font-size: 16px;
      font-weight: 650;
      transition: color 140ms ease;
    }

    span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>Demos</h1>
    <p>Small WebGPU demos</p>

    <nav aria-label="Demo list">
      <a href="./dual_marching/">
        <strong>Dual Marching</strong>
        <span>Marching Squares, Dual Contouring, and Dual Marching over the same field.</span>
      </a>
      <a href="./subgrid_marching_tetrahedra/">
        <strong>Subgrid Marching Tetrahedra</strong>
        <span>2D marching triangle comparison with subgrid sampling.</span>
      </a>
      <a href="./adaptive_delaunay_scaffolding/">
        <strong>Adaptive Delaunay Scaffolding</strong>
        <span>Adaptive Delaunay refinement and contour extraction prototype.</span>
      </a>
    </nav>
  </main>
</body>
</html>
